{%extends 'base.html'%}{%set title='المخزون والجرد'%}{%block content%}<div class="panel"><table><tr><th>المنتج</th><th>الباركود</th><th>السعر</th><th>الكمية</th><th>الحد الأدنى</th><th>الحالة</th></tr>{%for p in products%}<tr><td>{{p.name}}</td><td>{{p.barcode or ''}}</td><td>{{'%.3f'|format(p.price)}}</td><td><b>{{p.stock}}</b></td><td>{{p.min_stock}}</td><td class="{{'bad' if p.stock<=p.min_stock else 'ok'}}">{{'⚠ منخفض' if p.stock<=p.min_stock else '✓ جيد'}}</td></tr>{%endfor%}</table></div>{%endblock%}
