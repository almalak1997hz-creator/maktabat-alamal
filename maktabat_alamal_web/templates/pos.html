{%extends 'base.html'%}{%set title='الكاشير'%}{%block content%}<div class="pos"><div class="panel"><input id="q" class="search" placeholder="🔎 ابحث بالاسم أو الباركود" oninput="load()"><div id="grid" class="grid"></div></div><div class="panel"><h3>🛒 السلة</h3><div id="cart"></div><h2>الإجمالي: <span id="total">0.000</span> ر.ع</h2><input id="paid" class="search" type="number" step=".001" placeholder="المبلغ المدفوع" oninput="calc()"><p id="change">الباقي: 0.000 ر.ع</p><button class="btn wide" onclick="sell()">إتمام البيع</button></div></div>{%endblock%}{%block scripts%}<script>let cart=[];async function load(){let a=await fetch('/api/products?q='+encodeURIComponent(q.value)).then(r=>r.json());grid.innerHTML=a.map(x=>`<button class="product" onclick='add(${JSON.stringify(x)})'><b>${x.name}</b><span>${x.price.toFixed(3)} ر.ع</span><small>المخزون: ${x.stock}</small></button>`).join('')}function add(x){if(x.stock<1)return alert('غير متوفر');let y=cart.find(z=>z.id==x.id);if(y){if(y.quantity>=x.stock)return alert('الكمية أكبر من المخزون');y.quantity++}else cart.push({...x,quantity:1});draw()}function draw(){cart.innerHTML='';document.getElementById('cart').innerHTML=cart.map(x=>`<div class="row"><span>${x.name}</span><span><button onclick="chg(${x.id},-1)">−</button> ${x.quantity} <button onclick="chg(${x.id},1)">+</button></span><b>${(x.price*x.quantity).toFixed(3)}</b></div>`).join('')||'السلة فارغة';let t=cart.reduce((a,x)=>a+x.price*x.quantity,0);total.textContent=t.toFixed(3);calc()}function chg(id,d){let x=cart.find(z=>z.id==id);x.quantity+=d;if(x.quantity<1)cart=cart.filter(z=>z.id!=id);draw()}function calc(){let t=cart.reduce((a,x)=>a+x.price*x.quantity,0),p=+paid.value||0;change.textContent=(p>=t?'الباقي: ':'المتبقي: ')+Math.abs(p-t).toFixed(3)+' ر.ع'}async function sell(){if(!cart.length)return alert('السلة فارغة');let r=await fetch('/api/sale',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart.map(x=>({id:x.id,quantity:x.quantity})),paid:+paid.value||0})});let d=await r.json();if(!d.ok)return alert(d.message);alert('تم تسجيل الفاتورة #'+d.sale_id+'\nالباقي: '+d.change.toFixed(3)+' ر.ع');cart=[];paid.value='';draw();load()}load();</script>{%endblock%}
