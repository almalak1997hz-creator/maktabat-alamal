{%extends 'base.html'%}{%set title='المنتجات'%}{%block content%}<div class="panel"><h3>إضافة منتج</h3><form class="form" method="post"><input name="name" placeholder="اسم المنتج" required><input name="barcode" placeholder="الباركود"><input name="price" placeholder="السعر" required><input name="stock" placeholder="الكمية" required><input name="min_stock" value="5" placeholder="حد التنبيه"><button class="btn">إضافة</button></form></div><div class="panel"><table><tr><th>المنتج</th><th>الباركود</th><th>السعر</th><th>المخزون</th><th>الحد</th><th></th></tr>{%for p in products%}<tr><td>{{p.name}}</td><td>{{p.barcode or ''}}</td><td>{{'%.3f'|format(p.price)}}</td><td>{{p.stock}}</td><td>{{p.min_stock}}</td><td><form method="post" action="/products/{{p.id}}/delete" onsubmit="return confirm('حذف المنتج؟')"><button class="del">حذف</button></form></td></tr>{%endfor%}</table></div>{%endblock%}
